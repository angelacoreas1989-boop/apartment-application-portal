<section class="hero-card">

  <h2>Apartment Information</h2>

  <p><strong>Floor Plan:</strong> <span id="unit"></span></p>
  <p><strong>Details:</strong> <span id="details"></span></p>
  <p><strong>Base Rent:</strong> $<span id="rent"></span>/month</p>

</section>

<section class="hero-card">

  <h2>Applicant Information</h2>

  <label>First Name</label>
  <input type="text" required>

  <label>Middle Name</label>
  <input type="text">

  <label>Last Name</label>
  <input type="text" required>

  <label>Date of Birth</label>
  <input type="date" required>

  <label>Email Address</label>
  <input type="email" required>

  <label>Phone Number</label>
  <input type="tel" required>

</section>

<section class="hero-card">

  <h2>Identification Information</h2>

  <label>Social Security Number</label>
  <input type="text" placeholder="XXX-XX-XXXX">

  <label>Tax Identification Number</label>
  <input type="text">

  <label class="checkbox-label">
    <input type="checkbox">
    I do not have a Social Security Number or Tax ID.
  </label>

  <label>Government Issued ID Type</label>
  <select>
    <option>Select ID Type</option>
    <option>Driver's License</option>
    <option>State Identification Card</option>
    <option>Passport</option>
    <option>Military ID</option>
    <option>Permanent Resident Card</option>
  </select>

  <label>Upload Government Issued ID</label>
  <input type="file">

</section>

<section class="hero-card">

  <h2>Current Address</h2>

  <label>Street Address</label>
  <input type="text" required>

  <label>Unit Number</label>
  <input type="text">

  <label>City</label>
  <input type="text" required>

  <label>State</label>
  <input type="text" required>

  <label>ZIP Code</label>
  <input type="text" required>

</section>

<section class="hero-card">

  <h2>Employment Information</h2>

  <label>Company Name</label>
  <input type="text" required>

  <label>Employer Name</label>
  <input type="text" required>

  <label>Employer Title</label>
  <input type="text">

  <label>Employer Phone Number</label>
  <input type="tel" required>

  <label>Monthly Gross Income</label>
  <input type="number" required>

</section>

<section class="hero-card">

  <h2>Income Verification</h2>

  <label>Verification Method</label>
  <select required>
    <option value="">Select Verification Method</option>
    <option>Pay Stubs</option>
    <option>Bank Statements</option>
    <option>Offer Letter</option>
    <option>Employer Verification Letter</option>
    <option>Bank Verification Link</option>
    <option>Employer Verification Link</option>
  </select>

  <label>Upload Proof of Income</label>
  <input type="file" multiple>

  <label>Bank Verification Link</label>
  <input type="url" placeholder="https://">

  <label>Employer Verification Link</label>
  <input type="url" placeholder="https://">

</section>
